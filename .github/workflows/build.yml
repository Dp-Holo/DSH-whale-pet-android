name: Build APK

# 触发：push 到 main 分支 + 手动触发（Actions 页面 Run workflow 按钮）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # release 签名：secrets 未配置（如 fork 环境）时跳过，release 退化为 unsigned
      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "${RUNNER_TEMP}/whale-release.jks"
            echo "keystore decoded: $(ls -la ${RUNNER_TEMP}/whale-release.jks | awk '{print $5}') bytes"
          else
            echo "no keystore secret — release will be unsigned"
          fi

      - name: Build APKs (debug + release)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/whale-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: whale
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-pet-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-pet-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
